<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法陣ビーム（試作）</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;
    font-family:system-ui,sans-serif;color:#dff6ff;-webkit-user-select:none;user-select:none}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover}
  #bg{background:radial-gradient(120% 90% at 50% 40%,#1b2540 0%,#0a0e1a 55%,#04050a 100%)}
  #hud{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;
    font-size:13px;letter-spacing:.12em;opacity:.75;text-shadow:0 0 6px #000;pointer-events:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(4,6,12,.82);text-align:center;padding:24px}
  #start button{font-size:18px;padding:14px 34px;border-radius:999px;border:1px solid #8fe6ff;
    background:rgba(143,230,255,.12);color:#dff6ff;letter-spacing:.2em}
  #start p{margin:0;font-size:13px;line-height:1.9;opacity:.8}
  .ui{display:none}
  body.on .ui{display:block}
  #fire{position:fixed;left:50%;bottom:max(52px,calc(env(safe-area-inset-bottom) + 44px));transform:translateX(-50%);
    width:88px;height:88px;border-radius:50%;border:1.5px solid #bfefff;background:rgba(150,225,255,.16);
    color:#eafaff;font-size:16px;letter-spacing:.2em;text-indent:.2em;-webkit-tap-highlight-color:transparent}
  #fire:disabled{opacity:.22}
  #fire:not(:disabled){box-shadow:0 0 22px rgba(150,225,255,.55)}
  #voice{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));padding:8px 14px;border-radius:999px;
    border:1px solid rgba(190,235,255,.6);background:rgba(10,20,34,.5);color:#dff6ff;font-size:12px;letter-spacing:.1em}
  #vol{position:fixed;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 42px);padding:8px 14px;border-radius:999px;
    border:1px solid rgba(190,235,255,.6);background:rgba(10,20,34,.5);color:#dff6ff;font-size:12px;letter-spacing:.1em}
  #chant{position:fixed;left:14px;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 88px);gap:6px}
  body.on #chant{display:flex}
  #chant input{flex:1;min-width:0;font-size:16px;padding:9px 12px;border-radius:999px;border:1px solid rgba(190,235,255,.6);
    background:rgba(10,20,34,.55);color:#eafaff;outline:none}
  #chant input::placeholder{color:rgba(223,246,255,.5)}
  #chant button{padding:8px 14px;border-radius:999px;border:1px solid rgba(190,235,255,.6);background:rgba(10,20,34,.5);
    color:#dff6ff;font-size:13px;letter-spacing:.1em;white-space:nowrap}
  #chant button.live{background:rgba(150,225,255,.4)}
  #chantOut{position:fixed;left:18px;right:18px;top:calc(max(14px,env(safe-area-inset-top)) + 134px);font-size:12px;
    letter-spacing:.08em;opacity:.9;text-shadow:0 0 6px #000;pointer-events:none}
  #score{position:fixed;left:14px;top:max(18px,env(safe-area-inset-top));font-size:12px;letter-spacing:.1em;
    opacity:.85;text-shadow:0 0 6px #000;pointer-events:none}
</style>
</head>
<body>
<div id="bg" style="position:fixed;inset:0"></div>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<div id="hud"></div>
<div id="score" class="ui"></div>
<button id="voice" class="ui">声で発射：切</button>
<button id="vol" class="ui">音量：中</button>
<button id="fire" class="ui" disabled>発射</button>
<form id="chant" class="ui" autocomplete="off">
  <input id="chantText" type="text" enterkeyhint="send" maxlength="60" placeholder="詠唱（例：燃え盛れ 紅蓮の竜よ うねり進め）">
  <button id="chantMic" type="button">声</button>
  <button id="chantGo" type="submit">唱える</button>
</form>
<div id="chantOut" class="ui"></div>
<div id="start">
  <button id="go">はじめる</button>
  <p>かまえていると、魔法陣が 1 枚ずつ装填されます（最大 3 枚）。<br>まわりに浮かぶ的に照準を合わせて、<br>「発射」ボタンか、声で撃ちます。<br>枚数が多いほど、当たる範囲が広がります。<br>詠唱を入れて「唱える」と、ことばに合った魔法が出ます。<br>
  <span style="opacity:.6">（パソコン：マウスで向きを変える／スペースで発射）</span><br>
  <span style="opacity:.6">声で唱えるときは、ブラウザの音声認識を使います。<br>音声が、ブラウザの提供元のサーバーに送られることがあります。</span></p>
</div>
<script src="js/config.js?v=11"></script>
<script src="js/state.js?v=11"></script>
<script src="js/fx.js?v=11"></script>
<script src="js/circles.js?v=11"></script>
<script src="js/audio.js?v=11"></script>
<script src="js/beam.js?v=11"></script>
<script src="js/aim.js?v=11"></script>
<script src="js/backdrop.js?v=11"></script>
<script src="js/lexicon.js?v=11"></script>
<script src="js/chant.js?v=11"></script>
<script src="js/models.js?v=11"></script>
<script src="js/creature.js?v=11"></script>
<script src="js/mesh.js?v=11"></script>
<script src="js/chantui.js?v=11"></script>
<script src="js/main.js?v=11"></script>
</body>
</html>
