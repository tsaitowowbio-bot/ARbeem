<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法陣ビーム（試作）</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;
    font-family:system-ui,sans-serif;color:#dff6ff;-webkit-user-select:none;user-select:none}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover}
  #bg{background:radial-gradient(120% 90% at 50% 40%,#1b2540 0%,#0a0e1a 55%,#04050a 100%)}
  #hud{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;
    font-size:13px;letter-spacing:.12em;opacity:.75;text-shadow:0 0 6px #000;pointer-events:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(4,6,12,.82);text-align:center;padding:24px}
  #start button{font-size:18px;padding:14px 34px;border-radius:999px;border:1px solid #8fe6ff;
    background:rgba(143,230,255,.12);color:#dff6ff;letter-spacing:.2em}
  #start p{margin:0;font-size:13px;line-height:1.9;opacity:.8}
  .ui{display:none}
  body.on .ui{display:block}
  #fire{position:fixed;left:50%;bottom:max(52px,calc(env(safe-area-inset-bottom) + 44px));transform:translateX(-50%);
    width:88px;height:88px;border-radius:50%;border:1.5px solid #bfefff;background:rgba(150,225,255,.16);
    color:#eafaff;font-size:16px;letter-spacing:.2em;text-indent:.2em;-webkit-tap-highlight-color:transparent}
  #fire:disabled{opacity:.22}
  #fire:not(:disabled){box-shadow:0 0 22px rgba(150,225,255,.55)}
  #voice{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));padding:8px 14px;border-radius:999px;
    border:1px solid rgba(190,235,255,.6);background:rgba(10,20,34,.5);color:#dff6ff;font-size:12px;letter-spacing:.1em}
  #vol{position:fixed;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 42px);padding:8px 14px;border-radius:999px;
    border:1px solid rgba(190,235,255,.6);background:rgba(10,20,34,.5);color:#dff6ff;font-size:12px;letter-spacing:.1em}
  #score{position:fixed;left:14px;top:max(18px,env(safe-area-inset-top));font-size:12px;letter-spacing:.1em;
    opacity:.85;text-shadow:0 0 6px #000;pointer-events:none}
</style>
</head>
<body>
<div id="bg" style="position:fixed;inset:0"></div>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<div id="hud"></div>
<div id="score" class="ui"></div>
<button id="voice" class="ui">声で発射：切</button>
<button id="vol" class="ui">音量：中</button>
<button id="fire" class="ui" disabled>発射</button>
<div id="start">
  <button id="go">はじめる</button>
  <p>かまえていると、魔法陣が 1 枚ずつ装填されます（最大 3 枚）。<br>まわりに浮かぶ的に照準を合わせて、<br>「発射」ボタンか、声で撃ちます。<br>枚数が多いほど、当たる範囲が広がります。<br>
  <span style="opacity:.6">（パソコン：マウスで向きを変える／スペースで発射）</span></p>
</div>
<script>
'use strict';
// ---- 調整用の値 ----
const MAX = 3;              // 魔法陣の枚数
const CHARGE_SEC = 0.55;    // かまえて 1 枚たまるまでの秒数
const HI = 0.5;             // 効果音の高さ（1 で元の高さ。小さいほど低い）
const SHAKE_G = 13;         // 振りと見なす加速度（m/s²、重力を除く）
const SHAKE_GAP = 320;      // 振りを続けて数えない時間（ms）
const READY_SEC = 0.3;      // 発射の合図から、回転が上がりきるまで
const IGNITE_GAP = 0.11;    // 手前から順に光る間隔
const TOL = [0, 0.04, 0.065, 0.095];    // 当たる範囲（照準の輪の半径、ラジアン）。装填 1・2・3 枚のとき
const TARGETS = 3;          // 同時に浮かぶ的の数
const VOICE_MIN = 0.07;     // 声と見なす最小の大きさ（0〜1）
const VOICE_RATIO = 4;      // まわりの音の何倍で声と見なすか
const FLY_SEC = 0.5;        // 弾が狙った先に届くまでの時間
const DEPTH = [1.3, 2.3, 3.8];          // 魔法陣の奥行き（手前→奥）
const RADIUS = [0.56, 0.80, 1.08];      // 魔法陣の大きさ
const STAR = [[6,2],[5,2],[8,3]];       // 中の星形（頂点数, とばす数）
const HUE = [186, 212, 262];            // 色（水色 → 青 → 紫）
const SPIN = [0.55, 0.42, 0.32];        // ふだんの回転の速さ（rad/秒）
const Z0 = 0.6, Z1 = 40, Y0 = -0.5;     // 弾道（手元の下 → 画面中央の奥）
const TAU = Math.PI * 2;

const cv = document.getElementById('fx'), g = cv.getContext('2d');
const hud = document.getElementById('hud'), fireBtn = document.getElementById('fire'), voiceBtn = document.getElementById('voice'), scoreEl = document.getElementById('score'), volBtn = document.getElementById('vol'), camEl = document.getElementById('cam');
let W = 0, H = 0, F = 0, DPR = 1, FC = 400;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; F = Math.min(W, H) * 0.92; FC = Math.min(W, H) * 1.07;   // FC：カメラ映像の画角に合わせた倍率
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

// ---- 向きの変化で魔法陣を遅れてついてこさせる（手前ほど大きくずれ、狙う先は画面中央から動かない）----
let ox = 0, oy = 0;
const pathY = z => Y0 * (1 - (z - Z0) / (Z1 - Z0));
function proj(z){
  const par = Math.max(0, 0.55 - z / 9);
  return [W/2 + ox * par, H/2 - pathY(z) / z * F + oy * par, F / z];
}

// ---- 魔法陣の形：外の帯・星・芯の 3 つを別々に回す（半径 1 で作っておく）----
function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const SHAPES = STAR.map(([p, q], i) => {
  const outer = new Path2D(), mid = new Path2D(), core = new Path2D(), r = rnd(1234 + i * 77);
  const ring = (P, R) => { P.moveTo(R, 0); P.arc(0, 0, R, 0, TAU); };
  ring(outer, 1); ring(outer, 0.94); ring(outer, 0.74);
  const n = 22 + i * 4;               // ルーン風の短い線
  for (let k = 0; k < n; k++){
    const a = k / n * TAU, c = Math.cos(a), s = Math.sin(a);
    const pt = (u, v) => { const R = 0.84 + v * 0.065, t = u * 0.05; return [c*R - s*t, s*R + c*t]; };
    outer.moveTo(...pt(r()*2-1, -1));
    for (let m = 0; m < 3; m++) outer.lineTo(...pt(r()*2-1, m - 1 + r()*0.5));
  }
  for (let k = 0; k < p * 2; k++){ const a = k / (p*2) * TAU, R1 = k % 2 ? 1.03 : 1.07;
    outer.moveTo(Math.cos(a), Math.sin(a)); outer.lineTo(Math.cos(a)*R1, Math.sin(a)*R1); }
  ring(mid, 0.70);
  const gcd = (a, b) => b ? gcd(b, a % b) : a, g2 = gcd(p, q);
  for (let j = 0; j < g2; j++) for (let k = 0; k <= p / g2; k++){
    const a = j / p * TAU + k * q / p * TAU; mid[k ? 'lineTo' : 'moveTo'](Math.cos(a)*0.70, Math.sin(a)*0.70); }
  for (let k = 0; k < p; k++){ const a = k / p * TAU, x = Math.cos(a)*0.70, y = Math.sin(a)*0.70;
    mid.moveTo(x + 0.05, y); mid.arc(x, y, 0.05, 0, TAU); }
  ring(core, 0.30); ring(core, 0.24);
  const m = 3 + i;
  for (let k = 0; k <= m; k++){ const a = k / m * TAU; core[k ? 'lineTo' : 'moveTo'](Math.cos(a)*0.24, Math.sin(a)*0.24); }
  for (let k = 0; k < m; k++){ const a = (k + 0.5) / m * TAU;
    core.moveTo(Math.cos(a)*0.30, Math.sin(a)*0.30); core.lineTo(Math.cos(a)*0.44, Math.sin(a)*0.44); }
  return [outer, mid, core];
});
const PART_SPIN = [1, -1.7, 3.1];   // 外・星・芯の回転の比（星は逆回り）

// heat：0＝ふだん、1＝白く燃える
function drawCircle(i, c, scale, alpha, heat, t){
  const [x, y, s] = proj(c.z || DEPTH[i]), R = (c.R != null ? c.R : RADIUS[i] * s) * scale, hue = HUE[i];
  const breath = 0.85 + 0.15 * Math.sin(t * 2.1 + i * 1.7);
  const lum = 72 + 24 * heat, sat = 95 - 45 * heat, A = alpha * (breath + heat * 0.6);
  g.save(); g.translate(x, y); g.scale(R, R * 0.9);
  // 輪に沿ったにじみ
  const gl = g.createRadialGradient(0, 0, 0.2, 0, 0, 1.3);
  gl.addColorStop(0, `hsla(${hue},90%,65%,${(0.05 + 0.30 * heat) * alpha})`);
  gl.addColorStop(0.68, `hsla(${hue},95%,62%,${(0.13 + 0.35 * heat) * A})`);
  gl.addColorStop(1, `hsla(${hue},95%,60%,0)`);
  g.fillStyle = gl; g.beginPath(); g.arc(0, 0, 1.3, 0, TAU); g.fill();
  // 線：太く淡い → 中 → 細く明るい、の 3 度がき
  for (let k = 0; k < 3; k++){
    g.save(); g.rotate(c.ang[k]);
    const P = SHAPES[i][k];
    g.strokeStyle = `hsla(${hue},${sat}%,${lum - 8}%,${A * 0.10})`; g.lineWidth = (9 + heat * 10) / R; g.stroke(P);
    g.strokeStyle = `hsla(${hue},${sat}%,${lum}%,${A * 0.28})`;    g.lineWidth = (3.5 + heat * 3) / R; g.stroke(P);
    g.strokeStyle = `hsla(${hue},${sat}%,${lum + 12}%,${Math.min(1, A * 0.95)})`; g.lineWidth = 1.1 / R; g.stroke(P);
    g.restore();
  }
  // 外の輪を走る光と、輪の上を回る光の粒
  const sw = -c.ang[0] * 2.2 + i;
  g.strokeStyle = `rgba(255,255,255,${0.55 * alpha})`; g.lineWidth = 2.4 / R;
  g.beginPath(); g.arc(0, 0, 1, sw, sw + 0.7 + heat); g.stroke();
  g.beginPath(); g.arc(0, 0, 0.74, -sw, -sw + 0.5 + heat); g.stroke();
  for (let k = 0; k < 3; k++){
    const a = c.ang[0] * 1.6 + k * TAU / 3, px = Math.cos(a) * 0.97, py = Math.sin(a) * 0.97, pr = 0.07 + heat * 0.05;
    const pg = g.createRadialGradient(px, py, 0, px, py, pr);
    pg.addColorStop(0, `rgba(255,255,255,${0.9 * alpha})`); pg.addColorStop(1, `hsla(${hue},95%,70%,0)`);
    g.fillStyle = pg; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
  }
  g.restore();
}

// ---- 光のにじみ（先に絵を作っておき、貼って使う）----
const SPR = {};
[186, 212, 262, 200, 45, 320].forEach(h => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, `hsla(${h},100%,82%,0.75)`);
  gr.addColorStop(0.5, `hsla(${h},100%,65%,0.22)`); gr.addColorStop(1, `hsla(${h},100%,60%,0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128); SPR[h] = c;
});
function glow(x, y, r, a, hue, sx, sy, rot){
  if (a <= 0.003 || r <= 0.2) return;
  g.globalAlpha = Math.min(1, a);
  if (sx){ g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(sx, sy || 1); g.drawImage(SPR[hue], -r, -r, r*2, r*2); g.restore(); }
  else g.drawImage(SPR[hue], x - r, y - r, r*2, r*2);
  g.globalAlpha = 1;
}

// ---- 光の粒・衝撃波の帯・閃光 ----
let parts = [], rings = [], flares = [], shards = [], shake = 0, flash = 0, punch = 0;
function part(x, y, vx, vy, life, hue, size, drag){ const p = { x, y, vx, vy, life, max: life, hue, size, drag: drag == null ? 2.5 : drag }; parts.push(p); return p; }
const STAR_HUE = [200, 45, 320, 262, 186];
function stars(x, y, n, speed, size, lift){        // またたく十字の星
  for (let k = 0; k < n; k++){ const a = Math.random() * TAU, v = speed * Math.random();
    const p = part(x, y, Math.cos(a) * v, Math.sin(a) * v, 0.6 + Math.random() * 0.9, STAR_HUE[Math.random() * 5 | 0], size * (0.5 + Math.random()), 2.2);
    p.star = Math.random() * 9; p.lift = lift || 0; } }
function burstFromCircle(i, n, speed, size){
  const [x, y, s] = proj(DEPTH[i]), R = RADIUS[i] * s;
  for (let k = 0; k < n; k++){ const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    part(x + Math.cos(a)*R, y + Math.sin(a)*R*0.9, Math.cos(a)*v, Math.sin(a)*v*0.9, 0.35 + Math.random()*0.5, HUE[i], size * (0.5 + Math.random())); }
}
function ring(z, r0, r1, dur, hue, thick, a){ rings.push({ z, r0, r1, dur, hue, thick: thick || 0.3, a: a || 1, born: now() }); }
function flare(z, size, dur, hue, streak){ flares.push({ z, size, dur, hue, streak, born: now() }); }
function drawFx(t, dt){
  for (const r of rings){                         // 衝撃波：外へ広がる、やわらかい光の帯
    const u = Math.max(0, (t - r.born) / r.dur); if (u >= 1) continue;
    const [x, y, s] = proj(r.z), e = 1 - Math.pow(1 - u, 3), R = (r.r0 + (r.r1 - r.r0) * e) * s, a = Math.pow(1 - u, 1.5) * r.a;
    g.save(); g.translate(x, y); g.scale(1, 0.9);
    const gr = g.createRadialGradient(0, 0, Math.max(0, R * (1 - r.thick)), 0, 0, R * 1.1);
    gr.addColorStop(0, `hsla(${r.hue},95%,70%,0)`); gr.addColorStop(0.7, `hsla(${r.hue},95%,75%,${a * 0.3})`);
    gr.addColorStop(0.88, `rgba(255,255,255,${a * 0.85})`); gr.addColorStop(1, `hsla(${r.hue},95%,75%,0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R * 1.1, 0, TAU); g.fill(); g.restore();
  }
  rings = rings.filter(r => t - r.born < r.dur);
  for (const f of flares){                        // 閃光：丸いにじみ＋横に走る光
    const u = Math.max(0, (t - f.born) / f.dur); if (u >= 1) continue;
    const [x, y] = proj(f.z), a = (1 - u) * (1 - u) * 0.6;
    glow(x, y, f.size * (0.5 + 0.9 * u), a, f.hue);
    glow(x, y, f.size * 0.35, a, f.hue);
    if (f.streak){ glow(x, y, f.size * 0.16, a * 0.9, f.hue, f.streak * (1 + u), 1 - u * 0.6);
                   glow(x, y, f.size * 0.10, a * 0.5, f.hue, 1 - u * 0.5, f.streak * 0.45); }
  }
  flares = flares.filter(f => t - f.born < f.dur);
  for (const p of parts){                         // 光の粒：速いほど進む向きに伸びる
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; const d = Math.exp(-dt * p.drag); p.vx *= d; p.vy *= d;
    const a = Math.max(0, p.life / p.max), v = Math.hypot(p.vx, p.vy);
    if (p.star != null){ p.vy -= p.lift * dt; const tw = 0.55 + 0.45 * Math.sin(t * 17 + p.star * 3), r = p.size * Math.sin(Math.min(1, a * 1.6) * Math.PI / 2) * tw;
      glow(p.x, p.y, r * 0.8, a, p.hue); glow(p.x, p.y, r * 0.45, a, p.hue, 4.2, 0.3); glow(p.x, p.y, r * 0.45, a, p.hue, 0.3, 4.2); continue; }
    glow(p.x, p.y, p.size * (0.35 + 0.65 * a), a, p.hue, 1 + v * 0.011, 1, Math.atan2(p.vy, p.vx));
  }
  parts = parts.filter(p => p.life > 0);
  for (const q of shards){                        // 破片：回りながら飛び散り、重さで落ちていく
    q.life -= dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    const d = Math.exp(-dt * 1.2); q.vx *= d; q.vy *= d;
    const a = Math.min(1, q.life / q.max * 2.2);
    g.save(); g.translate(q.x, q.y); g.rotate(q.rot);
    if (q.arc){ g.strokeStyle = `hsla(${q.hue},100%,85%,${a})`; g.lineWidth = 2.2; g.beginPath(); g.arc(0, q.size, q.size, -Math.PI/2 - q.arc, -Math.PI/2 + q.arc); g.stroke(); }
    else { const f = 0.35 + 0.65 * Math.abs(Math.cos(q.rot * 1.7));          // 回るたびに面が光る
      g.fillStyle = `hsla(${q.hue},100%,${70 + 25 * f}%,${a * (0.25 + 0.6 * f)})`; g.strokeStyle = `hsla(${q.hue},100%,92%,${a * 0.9})`; g.lineWidth = 1;
      g.beginPath(); g.moveTo(-q.size, q.size * q.sk); g.lineTo(q.size * 0.9, q.size * 0.25); g.lineTo(-q.size * 0.15, -q.size * 0.8); g.closePath(); g.fill(); g.stroke(); }
    g.restore();
  }
  shards = shards.filter(q => q.life > 0);
}
function shatter(x, y, R, hue){                  // 的が砕ける：三角の破片と、割れた輪のかけら
  for (let k = 0; k < 34; k++){ const a = Math.random() * TAU, v = 180 + Math.random() * 760, life = 0.7 + Math.random() * 0.8;
    shards.push({ x: x + Math.cos(a) * R * 0.5, y: y + Math.sin(a) * R * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 220, rot: Math.random() * TAU,
      vr: (Math.random() * 2 - 1) * 16, size: R * (0.14 + Math.random() * 0.3), sk: 0.3 + Math.random() * 0.6, life, max: life, hue: k % 4 ? hue : 200 }); }
  for (let k = 0; k < 7; k++){ const a = k / 7 * TAU + Math.random() * 0.4, v = 260 + Math.random() * 380, life = 0.8 + Math.random() * 0.5;
    shards.push({ x: x + Math.cos(a) * R, y: y + Math.sin(a) * R, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, rot: a + Math.PI / 2,
      vr: (Math.random() * 2 - 1) * 9, size: R, arc: 0.32, life, max: life, hue }); }
}

// ---- 広がっていく魔法陣の残像と、放射する光の筋 ----
let echoes = [], rays = [], echoN = 0;
function echoRing(i, z, R0, R1, dur, w, delay){ echoes.push({ i, z, R0, R1, dur, w, born: now() + (delay || 0),
  c: { z, R: R0, ang: [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU] } }); }
function lightRays(z, len, n, dur, hue, spin, at){ rays.push({ z, len, n, dur, hue, spin, at, seed: Math.random() * 99, born: now() }); }
function drawMagic(t, dt){
  for (const e of echoes){
    const u = (t - e.born) / e.dur; if (u < 0 || u >= 1) continue;
    const k = 1 - Math.pow(1 - u, 2.5); e.c.R = e.R0 + (e.R1 - e.R0) * k;
    for (let j = 0; j < 3; j++) e.c.ang[j] += e.w * PART_SPIN[j] * dt * (1 - u * 0.7);
    drawCircle(e.i, e.c, 1, Math.pow(1 - u, 1.4) * Math.min(1, u * 12), 0.35 * (1 - u), t);
  }
  echoes = echoes.filter(e => t - e.born < e.dur);
  for (const r of rays){
    const u = Math.max(0, (t - r.born) / r.dur); if (u >= 1) continue;
    const [x, y] = r.at || proj(r.z), a = Math.pow(1 - u, 1.6) * Math.min(1, 0.2 + u * 14), L = r.len * (0.45 + 0.75 * (1 - Math.pow(1 - u, 3)));
    const gr = g.createRadialGradient(x, y, 0, x, y, L);
    gr.addColorStop(0, `rgba(255,255,255,${a * 0.32})`); gr.addColorStop(0.3, `hsla(${r.hue},100%,80%,${a * 0.2})`); gr.addColorStop(1, `hsla(${r.hue},100%,70%,0)`);
    g.fillStyle = gr; g.beginPath();
    for (let k = 0; k < r.n; k++){
      const h = Math.abs(Math.sin(k * 12.9898 + r.seed) * 43758.5453) % 1, h2 = Math.abs(Math.sin(k * 78.233 + r.seed) * 12543.123) % 1;
      const ang = (k + h * 0.7) / r.n * TAU + r.spin * (t - r.born), l = L * (0.45 + 0.55 * h2), w = 0.018 + 0.05 * h;
      g.moveTo(x, y); g.lineTo(x + Math.cos(ang - w) * l, y + Math.sin(ang - w) * l); g.lineTo(x + Math.cos(ang + w) * l, y + Math.sin(ang + w) * l);
    }

// ---- 向き：端末の傾きから、カメラが向いている方向を求める ----

const aimAngle = d => Math.acos(Math.max(-1, Math.min(1, dot(d, fwd()))));

// ---- 声で発射：マイクの音の大きさだけを見る（言葉は聞き分けない。音声はどこにも送らない）----
let mic = null, micBuf = null, micFloor = 0.02, micHot = 0, micStream = null;
async function toggleVoice(){
  if (mic){ micStream.getTracks().forEach(tr => tr.stop()); mic = null; voiceBtn.textContent = '声で発射：切'; voiceBtn.style.background = ''; return; }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    const an = ac.createAnalyser(); an.fftSize = 1024; ac.createMediaStreamSource(micStream).connect(an);
    micBuf = new Float32Array(1024); mic = an; voiceBtn.textContent = '声で発射：入';
  } catch (e) { voiceBtn.textContent = '声：使えません'; }
}
function listenVoice(t){
  if (!mic) return;
  mic.getFloatTimeDomainData(micBuf); let sum = 0; for (const v of micBuf) sum += v * v;

// ---- 毎フレーム ----
let last = now(), lastRing = 0;
function frame(){
  const t = now(), dt = Math.min(0.05, t - last); last = t;

    if (camEl.isConnected) camEl.style.transform = punch > 0.01 ? `scale(${1 + punch * 0.05})` : ''; }

      const i = ignited++, s = proj(DEPTH[i])[2]; circles[i].ignite = t;
      ring(DEPTH[i], RADIUS[i] * 0.2, RADIUS[i] * 1.35, 0.4, HUE[i], 0.45);
      flare(DEPTH[i], RADIUS[i] * s * 1.5, 0.5, HUE[i], 7);

    }

      phase = 'fire'; tPhase = t; sndFire(); shake = 30; flash = 1;
      ring(Z0 + 0.3, 0.1, 1.9, 0.45, 200, 0.5);
      flare(Z0 + 0.5, Math.min(W, H) * 0.3, 0.35, 200, 6);
      { const m = Math.min(W, H); lightRays(DEPTH[0], m * 0.7, 18, 0.8, 200, 0.5);          // 放射する光と、開く大きな陣
        echoRing(2, DEPTH[0], m * 0.12, m * 0.62, 0.7, 5); echoRing(1, DEPTH[0], m * 0.06, m * 0.44, 0.8, -7, 0.06); }

        part(vx + Math.cos(a) * d, vy + Math.sin(a) * d, Math.cos(a) * v, Math.sin(a) * v, 0.32, 200, 7 + Math.random() * 6, 0.5); }

    circles.forEach((c, i) => { if (!c.burst && bulletZ > DEPTH[i]){ c.burst = t; shake += 14; const s = proj(DEPTH[i])[2];
      ring(DEPTH[i], 0.2, RADIUS[i] * 2.3, 0.55, HUE[i], 0.5); flare(DEPTH[i], RADIUS[i] * s * 1.3, 0.4, HUE[i], 4);
      burstFromCircle(i, 46, 560, 12); sndPass(i);

      echoRing(i, DEPTH[i], R, R * 2.2, 0.7, 6); echoRing(i, DEPTH[i], R * 0.6, R * 1.7, 0.8, -5, 0.08);

      lightRays(Z1, m * 0.8, 22, 1.3, 200, 0.35); lightRays(Z1, m * 0.5, 14, 1.0, 320, -0.5);

}
requestAnimationFrame(frame);

// ---- 開始（カメラ・センサーの許可はボタンを押したときに求める）----
document.getElementById('go').addEventListener('click', async () => {
  document.getElementById('start').remove();
  initAudio();
  try {
    if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission();
  } catch (e) {}
  try {
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission();
  } catch (e) {}
  addEventListener('devicemotion', onMotion); addEventListener('deviceorientation', onOri);
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    document.getElementById('cam').srcObject = s;
  } catch (e) { document.getElementById('cam').remove(); }
  phase = 'load'; document.body.classList.add('on');
  fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); trigger(); });
  voiceBtn.addEventListener('click', toggleVoice);
  volBtn.addEventListener('click', () => { volI = (volI + 1) % 4; localStorage.setItem('arbeem-vol', volI); setVol(); });
  addEventListener('keydown', e => { if (e.code === 'Space') trigger(); if (e.code === 'KeyL') load(); });
  addEventListener('pointermove', e => { if (hasOri) return;
    lookAz = (e.clientX / W - 0.5) * 2.2; lookEl = -(e.clientY / H - 0.5) * 1.2; lookBasis(); });
});
</script>
</body>
